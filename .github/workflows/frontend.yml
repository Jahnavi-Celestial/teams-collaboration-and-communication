name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json 

    - name: Install Dependencies
      run: |
        npm install
        npm install -D esbuild
      working-directory: client

    - name: Build Web Production Assets
      run: npx vite build
      working-directory: client
      env:
        VITE_BACKEND_URL: ${{ secrets.PRODUCTION_BACKEND_URL }} 
        VITE_WS_URL: ${{ secrets.PRODUCTION_WS_URL }}
        CI: false

    - name: Trigger Static Content Update
      run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
